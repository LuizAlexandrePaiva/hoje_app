# O app é estático (pasta app/, sem build). A única parte no servidor é a
# função /api/sync, que guarda o backup cifrado no Netlify Blobs.
[build]
  publish = "app"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# O service worker precisa ser revalidado sempre para as atualizações chegarem.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
